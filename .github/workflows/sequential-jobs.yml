name: Multiple jobs workflow
on: workflow_dispatch
jobs:
  job-1:
    runs-on: ubuntu-slim
    steps:
      - name: Run job 1
        run: echo "Run job 1"
  job-2:
    runs-on: ubuntu-latest
    needs: job-1
    steps:
      - name: Run job 2
        run: echo "Run job 2"
  job-3:
    runs-on: ubuntu-slim
    needs: job-2
    steps:
      - name: RUN JOB 3
        run: echo "Run job 3"
